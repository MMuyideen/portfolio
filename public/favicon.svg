<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Muyideen Morenigbade monogram">
  <!--
    MM monogram, diamond counter. Geometry is the artifact's exactly: 4 paths on
    a 390×325 grid, constant 28 stroke, mitre joins. Nested <svg> does the
    scaling so the paths stay untouched.

    On its own dark chip rather than a bare stroke, so it stays legible against
    both light and dark browser chrome — and matches apple-touch-icon.png.
  -->
  <rect width="240" height="240" rx="26" fill="#0E0D11"/>
  <svg x="45" y="57" width="150" height="127" viewBox="-14 -14 418 353">
    <g fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linejoin="miter" stroke-miterlimit="10">
      <path d="M14 325 V14 L127 91"/>
      <path d="M376 325 V14 L263 91"/>
      <path d="M85 325 V121 L196 208 L307 121 V325"/>
      <path d="M148 179 L196 139 L244 179"/>
    </g>
  </svg>
</svg>
