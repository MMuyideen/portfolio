<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Muyideen Morenigbade — Blog"
      href="/rss.xml"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e14" />
    <script>
      // Applies a remembered light-mode choice before first paint, so there's no dark-then-light flash. Dark is the unconditional default — no prefers-color-scheme check.
      if (localStorage.getItem('theme') === 'light') {
        document.documentElement.classList.add('light')
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#f7f8fa')
      }
    </script>
    <!--
      Only the title is kept here, as the pre-boot fallback. Every descriptive
      tag (description, og:*, twitter:*) is owned by react-helmet-async per
      route — duplicating them here left two of each in the prerendered HTML,
      and scrapers read the first, which was always the home page's copy.
    -->
    <title>Muyideen Morenigbade — Cloud Platform & DevOps Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
