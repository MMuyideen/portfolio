name: Preview (v2)

# Deploys the v2 branch to a named Static Web Apps staging environment so it can
# be viewed side by side with production. Infrastructure is deliberately out of
# scope here — v2 shares production's SWA, storage, and app settings, and only
# `deploy.yml` (on main) is allowed to run Terraform.
#
# The side-by-side comparison is over and v1 won, so the push trigger is off and
# the staging environment has been deleted: this branch is an archive and must
# not redeploy on its own. Manual dispatch is kept so the preview can be brought
# back deliberately — note that GitHub only offers the Run workflow button for
# workflows present on the default branch.

on:
  workflow_dispatch:

# One preview at a time; a newer push supersedes an in-flight deploy.
concurrency:
  group: preview-v2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy v2 preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          # Marks the build as a preview: adds a noindex robots meta so the
          # comparison copy never competes with muyideen.dev in search.
          PREVIEW: "true"

      - name: Deploy to the v2 staging environment
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          # Pre-built above, same as deploy.yml: app_location must be `dist`.
          app_location: "dist"
          api_location: "api"
          output_location: ""
          skip_app_build: true
          deployment_environment: v2

      - name: Summarise
        run: |
          {
            echo "### v2 preview deployed"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Preview | ${{ steps.deploy.outputs.static_web_app_url }} |"
            echo "| Production | https://www.muyideen.dev |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo
            echo "Tear it down with the **Preview teardown (v2)** workflow."
          } >> "$GITHUB_STEP_SUMMARY"
