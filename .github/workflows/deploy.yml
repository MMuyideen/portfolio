name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - 'src/**'
      - 'api/**'
      - 'public/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    uses: MMuyideen/terraform-modules-and-pipelines/.github/workflows/terraform-apply.yml@main
    with:
      working_directory: terraform/
      cloud_provider: azure
      environment: production
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  deploy:
    name: Deploy to SWA
    needs: terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy static assets
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          # repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          # We pre-build with `npm run build` above, so point at the built
          # output. With skip_app_build the app_location is uploaded as-is and
          # output_location is ignored — so app_location must be `dist`.
          app_location: "dist"
          api_location: "api"
          output_location: ""
          skip_app_build: true
